name: cashew_marketplace
description: ""
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.3.0
  firebase_auth: ^6.2.0
  google_sign_in: ^7.2.0
  firebase_messaging: ^16.1.3
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.7

  # UI & Utils
  cupertino_icons: ^1.0.8
  flutter_html: ^3.0.0
  provider: ^6.1.2
  go_router: ^17.2.3
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1

  # Networking
  http: ^1.2.1
  dio: ^5.5.0
  pretty_dio_logger: ^1.4.0

  # Storage
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Media & UI
  cached_network_image: ^3.4.0
  shimmer: 3.0.0
  flutter_svg: ^2.0.11
  image_picker: ^1.1.0

  # Utils
  app_links: ^6.4.0
  jwt_decoder: ^2.0.1
  intl: ^0.20.2
  device_info_plus: ^13.1.0
  connectivity_plus: ^4.0.0
  share_plus: ^13.1.0
  interactiveviewer_gallery: ^0.6.0
  photo_view: ^0.15.0
  path_provider: ^2.1.5

  # Date Picker
  custom_date_range_picker: ^1.2.0

  flutter_cashfree_pg_sdk: ^2.4.0+52


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/market-place-logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/market-place-logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/language/
